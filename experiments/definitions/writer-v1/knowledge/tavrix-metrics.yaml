    statement: Metric batches use POST /v5/series.
    accepted_matchers:
      - kind: exact
        pattern: POST /v5/series
        case_sensitive: true
  - fact_id: series-limit
    statement: A request contains no more than 50 metric series.
    accepted_matchers:
      - kind: regex
        pattern: 'at most 50 metric series'
  - fact_id: label-limit
    statement: A series contains no more than 12 labels.
    accepted_matchers:
      - kind: regex
        pattern: 'at most 12 labels'
  - fact_id: raw-retention
    statement: Raw samples are retained for 14 days.
    accepted_matchers:
      - kind: exact
        pattern: retained for 14 days
  - fact_id: aggregate-retention
    statement: Hourly aggregates are retained for 400 days.
    accepted_matchers:
      - kind: exact
        pattern: retained for 400 days
  - fact_id: timestamp-format
    statement: Timestamps are Unix milliseconds in UTC.
    accepted_matchers:
      - kind: exact
        pattern: Unix milliseconds in UTC
        case_sensitive: true
