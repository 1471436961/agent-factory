[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-factory"
version = "1.0.0a1"
description = "A runtime-neutral framework for reproducible and auditable AI agent production."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "zhouyingda", email = "90090574+1471436961@users.noreply.github.com" },
]
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "PyYAML>=6,<7",
  "regex>=2024.11.6,<2027",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
agent-factory-demo = "agent_factory.demo:main"

[project.optional-dependencies]
demo = ["gradio>=6,<7"]
llm = ["openai>=2,<3"]
dev = [
  "mypy>=1.15,<2",
  "ruff>=0.11,<1",
  "types-regex>=2024,<2027",
]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.tmp/pytest -p no:cacheprovider"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".agents", ".codex"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent_factory"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["agent_factory"]

[tool.coverage.report]
show_missing = true
skip_covered = true
