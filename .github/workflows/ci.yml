name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.11"
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src tests

      - name: Test and collect branch coverage
        run: uv run pytest -q --cov --cov-report=term-missing

      - name: Enforce domain coverage
        run: >-
          uv run coverage report
          --include="src/agent_factory/domain/*"
          --fail-under=90

      - name: Enforce application coverage
        run: >-
          uv run coverage report
          --include="src/agent_factory/application/*"
          --fail-under=85

      - name: Enforce total coverage
        run: uv run coverage report --fail-under=80

      - name: Build distributions
        run: uv build

      - name: Verify packaged application resources
        run: >-
          uv run python -c "import glob, zipfile;
          wheel = glob.glob('dist/*.whl')[0];
          names = zipfile.ZipFile(wheel).namelist();
          expected = {
            'agent_factory/domain/evaluation.py',
            'agent_factory/domain/references.py',
            'agent_factory/domain/skills.py',
            'agent_factory/domain/services/evaluation.py',
            'agent_factory/domain/services/degradation.py',
            'agent_factory/domain/services/skills.py',
            'agent_factory/interfaces/api/contracts.py',
            'agent_factory/interfaces/api/errors.py',
            'agent_factory/interfaces/api/main.py',
            'agent_factory/interfaces/api/middleware.py',
            'agent_factory/interfaces/api/routers/audit.py',
            'agent_factory/interfaces/api/routers/evaluations.py',
            'agent_factory/interfaces/api/routers/instances.py',
            'agent_factory/interfaces/api/routers/knowledge.py',
            'agent_factory/interfaces/api/routers/prototypes.py',
            'agent_factory/interfaces/api/routers/skills.py',
            'agent_factory/infrastructure/sqlite/governance_repositories.py',
            'agent_factory/infrastructure/sqlite/repository_base.py',
            'agent_factory/infrastructure/sqlite/sql/001_initial.sql',
            'agent_factory/infrastructure/sqlite/sql/002_persistence_contracts.sql',
            'agent_factory/infrastructure/sqlite/sql/003_skill_governance.sql',
            'agent_factory/infrastructure/sqlite/sql/004_instance_configuration_checksum.sql',
            'agent_factory/infrastructure/sqlite/sql/005_task_outcome_integrity.sql'
          };
          assert expected <= set(names)"
