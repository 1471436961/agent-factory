name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.11"
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked --extra dev --extra test --extra llm --extra demo

      - name: Check formatting
        run: uv run ruff format --check src tests scripts experiments

      - name: Lint
        run: uv run ruff check src tests scripts experiments

      - name: Type check
        shell: bash
        run: |
          mkdir -p .tmp
          set +e
          uv run mypy src tests scripts experiments 2>&1 | tee .tmp/mypy.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            while IFS= read -r line; do
              printf '::error title=mypy::%s\n' "$line"
            done < .tmp/mypy.log
          fi
          exit "$status"

      - name: Verify reviewed contract snapshots
        run: uv run python -m scripts.contract_snapshots --check

      - name: Validate frozen M5 experiment fixtures
        run: >-
          uv run pytest -q tests/unit/experiments
          tests/integration/test_experiment_factory_rendering.py
          --cov=experiments
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Run Alpha security regression
        run: uv run pytest -q tests/security

      - name: Run transaction fault regression
        run: >-
          uv run pytest -q
          tests/integration/test_transaction_fault_injection.py
          tests/integration/test_tool_execution.py
          tests/integration/test_migrations.py

      - name: Test and collect branch coverage
        run: uv run pytest -q --cov --cov-report=term-missing

      - name: Enforce domain coverage
        run: >-
          uv run coverage report
          --include="src/agent_factory/domain/*"
          --fail-under=90

      - name: Enforce application coverage
        run: >-
          uv run coverage report
          --include="src/agent_factory/application/*"
          --fail-under=85

      - name: Enforce total coverage
        run: uv run coverage report --fail-under=80

      - name: Verify isolated distribution and local process
        shell: bash
        run: |
          cache_dir="$(uv cache dir)"
          uv run python -u -m scripts.local_alpha_smoke \
            --work-root .tmp/ci-local-alpha-smoke \
            --uv-cache-dir "$cache_dir" \
            --command-timeout 240 \
            --startup-timeout 30 \
            --shutdown-timeout 15
