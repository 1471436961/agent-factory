name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.11 quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          python-version: "3.11"
          enable-cache: true

      - name: Synchronize locked dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest -q

      - name: Build distributions
        run: uv build

      - name: Verify packaged migration resources
        run: >-
          uv run python -c "import glob, zipfile;
          wheel = glob.glob('dist/*.whl')[0];
          names = zipfile.ZipFile(wheel).namelist();
          assert 'agent_factory/infrastructure/sqlite/sql/001_initial.sql' in names"
